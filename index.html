    <!-- ============== FONTS · Self-Hosted FIRST (Fraunces + Sora, avoids ORB/CORB interception) ==============
         策略：
         1) /fonts/fonts.css 本地托管拉丁字体 Fraunces (display 900) + Sora (sans 400/700/800)
            → unicode-range 切分，浏览器按需加载 ≈ 0.3 MB 总
         2) CJK 中文字体 Noto Serif SC / Noto Sans SC 走 Google CDN，配合 preconnect + dns-prefetch
         3) 字体回退：Fraunces → Noto Serif SC → Songti SC → SimSun；Sora → Noto Sans SC → PingFang SC → system
         4) 全部 font-display: swap，永远不会出现 "invisible text on slow loads"
    -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

    <!-- 本地托管 Fraunces + Sora（关键字体，100% 可用，ORB 拦截也不会失效） -->
    <link rel="preload" as="style" href="/fonts/fonts.css" />
    <link rel="stylesheet" href="/fonts/fonts.css" />

    <!-- Google CDN Noto CJK（CJK only，unicode-range 切分，按需加载；若被拦截则优雅降级到系统中文字体） -->
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet" media="print" onload="this.media='all'"
    />
    <noscript>

        href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap"
        rel="stylesheet"
